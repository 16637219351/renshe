  .back-btn{
    border:none;background:transparent;color:var(--ink-soft);cursor:pointer;

  .result-emoji{font-size:52px;display:block;}
  .camp{font-size:14px;letter-spacing:2px;color:var(--ink-soft);margin:8px 0 0;}

  .tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:26px;}
  .tag-chip{background:var(--cream);border-radius:999px;padding:4px 14px;font-size:13.5px;}
  .r-card{border-radius:20px;padding:18px 18px;margin-bottom:16px;box-shadow:0 6px 16px rgba(91,70,64,.08);}
  .r-card h3{margin:0 0 8px;font-size:17px;}
  .r-card p{margin:0;font-size:15.5px;line-height:1.8;}
  .result-foot{text-align:center;font-size:13.5px;color:var(--ink-soft);margin-top:26px;}

  /* ---------- 动画 ---------- */
  @keyframes fadein{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .anim{animation:fadein .35s ease both;}
  @media (prefers-reduced-motion: reduce){
    .anim{animation:none !important;}
    .opt,.btn-start{transition:none !important;}
  }
  @media (max-width:390px){
    h1{font-size:28px;}
    .cards{grid-template-columns:1fr;}
  }
</style>
</head>

/* ================= 计分 ================= */
/* 计分规则：
   D 居多 → 薛定谔的社交悍匪；A 居多 → 人间全自动许愿池 / 关系外包客服；
   B、C 居多 → 赛博空间潜水艇 / 情绪单机玩家；A/B/C/D 极度均匀 → 隐藏彩蛋。 */
function calc(answers){
  const n = {A:0,B:0,C:0,D:0};
  answers.forEach(a => n[a]++);
  const vals = [n.A, n.B, n.C, n.D];
  const max = Math.max.apply(null, vals);
  const min = Math.min.apply(null, vals);
  if (max - min <= 1) return 11;               /* 极度均匀 → 隐藏款 */
  if (n.D === max) return n.A >= n.B ? 9 : 10; /* 悍匪：线上战神 vs 随时发疯 */
  if (n.A === max) return n.C >= n.D ? (n.D >= n.B ? 6 : 5) : (n.D >= n.B ? 8 : 7); /* 许愿池/客服 */
  /* B、C 居多 */
  if (n.C === max) return n.D >= n.B ? 2 : 1;  /* 诈尸 vs 已读乱回 */
  return n.A >= n.C ? 4 : 3;                   /* 系统崩溃 vs 拔网线 */
}

/* ================= 页面逻辑 ================= */
const homeEl = document.getElementById('home');
const quizEl = document.getElementById('quiz');
const resultEl = document.getElementById('result');
const qText = document.getElementById('qText');
const qNo = document.getElementById('qNo');
const qCard = document.getElementById('qCard');
const optsEl = document.getElementById('opts');
const bar = document.getElementById('bar');
const quizCount = document.getElementById('quizCount');
const OPT_COLORS = ['c-pink','c-apricot','c-cream','c-blue'];
const LETTERS = ['A','B','C','D'];
let current = 0;
let answers = [];

document.getElementById('startBtn').addEventListener('click', () => {
  homeEl.hidden = true;
  quizEl.hidden = false;
  window.scrollTo(0,0);
  renderQuestion(0);
});

const backBtn = document.getElementById('backBtn');
backBtn.addEventListener('click', () => {
  if (current > 0) renderQuestion(current - 1);
});

function renderQuestion(i){
  backBtn.hidden = (i === 0);
  current = i;
  const item = QUESTIONS[i];
  quizCount.textContent = '第 ' + (i+1) + ' / ' + QUESTIONS.length + ' 题';
  bar.style.width = (i / QUESTIONS.length * 100) + '%';
  qNo.textContent = '场景 ' + String(i+1).padStart(2,'0');
  qText.textContent = item.q;
  optsEl.innerHTML = '';
  item.o.forEach((text, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt anim ' + OPT_COLORS[idx];
    btn.style.animationDelay = (idx * 0.05) + 's';
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = LETTERS[idx];
    btn.appendChild(tag);
    btn.appendChild(document.createTextNode(text));
    btn.addEventListener('click', () => pick(idx, btn));
    optsEl.appendChild(btn);
  });
  qCard.classList.remove('anim'); void qCard.offsetWidth; qCard.classList.add('anim');
}

function pick(idx, btn){
  if (btn.classList.contains('picked')) return;
  answers[current] = LETTERS[idx];
  btn.classList.add('picked');
  const delay = (current === QUESTIONS.length - 1) ? 420 : 360;
  setTimeout(() => {
    if (current === QUESTIONS.length - 1) {
      showResult();
    } else {
      renderQuestion(current + 1);
    }
  }, delay);
}

function showResult(){
  quizEl.hidden = true;
  resultEl.hidden = false;
  window.scrollTo(0,0);
  bar.style.width = '100%';
  const id = calc(answers);
  const v = RESULTS.list[id];
  const camp = RESULTS.camps[v.camp];
  document.getElementById('rEmoji').textContent = (id === 11) ? '🥚' : camp.emoji;
  document.getElementById('rCamp').textContent = (id === 11) ? '隐藏彩蛋 · 全地形自适应伪人' : '阵营：' + camp.name;
  document.getElementById('rSlogan').textContent = camp.slogan;
  document.getElementById('rName').textContent = (id === 11) ? '你触发隐藏款了！' : v.name;
  document.getElementById('rCode').textContent = '出厂代码：' + v.code;
  const tags = document.getElementById('rTags');
  tags.innerHTML = '';
  v.tags.forEach(t => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.textContent = t;
    tags.appendChild(chip);
  });
  document.getElementById('rHigh').textContent = v.high;
  document.getElementById('rLeak').textContent = v.leak;
  document.getElementById('rBand').textContent = v.band;
}
